[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "threat-hunting-harness"
version = "0.1.0"
description = "Resumable, evidence-first threat hunts through a shared MCP gateway"
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2", "httpx>=0.28,<1", "pydantic>=2.11,<3", "python-dotenv>=1.1,<2", "jsonschema>=4.23,<5", "uvicorn>=0.35,<1", "censys-platform==0.16.2"]

[project.scripts]
hunt = "hunting_harness.cli:main"

[project.optional-dependencies]
gti = ["gti-mcp @ git+https://github.com/google/mcp-security@9885ec6856ec72333091cf1a3b2ac1bb26abe149#subdirectory=server/gti"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "mypy>=1.15,<2", "ruff>=0.11,<1", "types-jsonschema"]

[tool.hatch.build.targets.wheel]
packages = ["src/hunting_harness"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
